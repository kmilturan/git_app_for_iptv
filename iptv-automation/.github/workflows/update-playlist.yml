name: Update IPTV Playlist

on:
  schedule:
    - cron: '17 * * * *' # Hər saatın 17-ci dəqiqəsində avtomatik işləyir
  workflow_dispatch: # Əl ilə (Manual) istənilən vaxt işə salmaq üçün düymə

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd iptv-automation
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run playlist generator
        run: |
          cd iptv-automation
          python src/main.py

      - name: Commit and push if playlist changed
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add iptv-automation/playlist.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update playlist.m3u [skip ci]" && git push)
